[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmegohand"
version = "1.0.0"
description = "Egocentric hand pose estimation with head-mounted mmWave radar and IMU"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Yizhe Lv"},
  {name = "Fei Wang"}
]
dependencies = [
  "h5py>=3.8",
  "numpy>=1.23",
  "psutil>=5.9",
  "PyYAML>=6.0",
  "scipy>=1.9",
  "torch>=1.13"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.4"
]
labels = [
  "mediapipe>=0.10",
  "opencv-python>=4.8"
]

[tool.setuptools.packages.find]
include = ["mmegohand*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
